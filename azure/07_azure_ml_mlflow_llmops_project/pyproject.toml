[tool.poetry]
name = "poc-07-azure-ml-mlflow-llmops"
version = "0.1.0"
description = "Beginner-friendly Azure Machine Learning + MLflow shipment-delay MLOps/LLMOps POC"
authors = ["POC-07 Learner"]
readme = "README.md"
packages = [{ include = "ml" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
mlflow = "2.22.5"
azureml-mlflow = "1.62.0.post6"
azure-ai-ml = "1.34.1"
azure-identity = ">=1.20,<2"
scikit-learn = "1.7.2"
pandas = ">=2.2,<3"
numpy = ">=1.26,<3"
python-dotenv = "1.2.3"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<9"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
