name: poc07-ci

on:
  push:
  pull_request:

jobs:
  local-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: python -m pip install "poetry>=2,<3"
      - name: Install project dependencies
        run: poetry install --no-interaction
      - run: poetry run python -m ml.generate_data --rows 500
      - run: poetry run python -m ml.train --tracking local
      - run: poetry run python -m ml.score --tracking local
      - run: poetry run python -m ml.verify_poc --tracking local
      - run: poetry run pytest -q
